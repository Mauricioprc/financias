<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>MR Gestão</title>
  <link rel="icon" type="image/png" href="/img/LogoMRrosto.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app-root" class="app-root">
    <header class="app-header" id="app-header" hidden>
      <div class="app-header__brand">
        <img src="/img/LogoMRrosto.png" alt="" class="app-header__logo" />
        <span class="app-header__title">MR Gestão</span>
      </div>
      <button type="button" class="app-header__logout" id="btn-logout" aria-label="Sair">
        Sair
      </button>
    </header>

    <div class="app-body">
      <nav class="sidebar" id="sidebar" hidden aria-label="Navegação principal"></nav>

      <main class="app-main" id="app" role="main"></main>
    </div>

    <nav class="bottom-nav" id="bottom-nav" hidden aria-label="Navegação principal"></nav>
    <div class="sheet-overlay" id="sheet-overlay" hidden></div>
    <div class="sheet" id="sheet" hidden></div>
  </div>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <script src="/js/vendor/chart.min.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/crud.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/home.js"></script>
  <script src="/js/views/accounts.js"></script>
  <script src="/js/views/categories.js"></script>
  <script src="/js/views/transactions.js"></script>
  <script src="/js/views/creditCards.js"></script>
  <script src="/js/views/invoices.js"></script>
  <script src="/js/views/transfers.js"></script>
  <script src="/js/views/recurring.js"></script>
  <script src="/js/views/goals.js"></script>
  <script src="/js/views/investments.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
